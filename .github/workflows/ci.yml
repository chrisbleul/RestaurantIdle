# Nutzt die im CGOPlattform-Repo gebauten wiederverwendbaren Bausteine
# (verify-node, deploy) -- selbes Muster wie ToDoCGO/EasyCar/etc.
# (Arbeitsauftrag AP4.1). Der Unity-WebGL-Build ist neu (erstes native/WebGL-
# Projekt auf der Plattform) und laeuft deshalb inline statt ueber
# build-image.yml: der WebGL-Build muss vor dem Docker-Image-Build fertig sein
# und als Artifact eingebettet werden, dafuer bietet der reusable
# build-image.yml keinen Einhaengepunkt.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify-api:
    uses: chrisbleul/CGOPlattform/.github/workflows/verify-node.yml@main
    with:
      working-directory: apps/api
      verify-commands: |
        npm run typecheck
        npm test
        npm run build

  verify-balancing-core:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test game/BalancingCore.sln

  # Unity Editor gibt es nur fuer x86_64 Linux (nicht arm64, siehe
  # PLAN.md/Notizen zur EC2 -- Graviton) -- deshalb ubuntu-latest statt der
  # arm64-Runner aus build-image.yml. Nur bei main-Push: ein WebGL-Build
  # dauert 15-40 Minuten, das auf jeden PR/Branch-Push loszulassen waere reine
  # Wartezeit ohne Nutzen.
  webgl-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: client
          targetPlatform: WebGL
          buildMethod: RestaurantIdle.Editor.CIBuild.BuildWebGl
      - uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: client/Build/WebGL
          retention-days: 7

  build-api-image:
    needs: [verify-api, verify-balancing-core, webgl-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: apps/api/public/webgl

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/restaurant-idle-api:latest
            ghcr.io/${{ github.repository_owner }}/restaurant-idle-api:${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-api-image
    uses: chrisbleul/CGOPlattform/.github/workflows/deploy.yml@main
    with:
      slug: restaurant
    secrets: inherit
