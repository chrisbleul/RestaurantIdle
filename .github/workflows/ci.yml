# verify-api und deploy sind bewusst NICHT ueber die wiederverwendbaren
# Bausteine aus dem CGOPlattform-Repo eingebunden (anders als bei den anderen
# Apps, AP4.1): dieses Repo ist public (unbegrenzte Actions-Minuten fuer die
# langen Unity-Builds), CGOPlattform ist privat -- ein oeffentliches Repo
# kann grundsaetzlich keinen "workflow_call"-Baustein aus einem privaten Repo
# aufrufen (GitHub-Sicherheitsgrenze, keine Einstellung hebelt das aus). Die
# paar Schritte sind deshalb inline dupliziert, inhaltlich identisch zu
# verify-node.yml/deploy.yml.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
        continue-on-error: true

  verify-balancing-core:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test game/BalancingCore.sln

  # Unity Editor gibt es nur fuer x86_64 Linux (nicht arm64, siehe
  # PLAN.md/Notizen zur EC2 -- Graviton) -- deshalb ubuntu-latest statt der
  # arm64-Runner fuer die anderen Jobs. Nur bei main-Push: ein WebGL-Build
  # dauert 15-40 Minuten, das auf jeden PR/Branch-Push loszulassen waere reine
  # Wartezeit ohne Nutzen.
  webgl-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: client
          targetPlatform: WebGL
          buildMethod: RestaurantIdle.Editor.CIBuild.BuildWebGl
      - uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: client/Build/WebGL
          retention-days: 7

  build-api-image:
    needs: [verify-api, verify-balancing-core, webgl-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: apps/api/public/webgl

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/restaurant-idle-api:latest
            ghcr.io/${{ github.repository_owner }}/restaurant-idle-api:${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-api-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy auf die EC2
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy \
            ubuntu@${{ secrets.DEPLOY_HOST }} "restaurant ${{ github.sha }}"
